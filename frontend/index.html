<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Job Updates - Homepage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="logo">JobUpdates</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Admin Login</a>
    </div>
  </nav>

  <header class="header">
    <h1>Latest Job Updates</h1>
    <p>Short descriptions — click Read More to view full details on Blogger.</p>
  </header>

  <main class="container" id="jobs-container">
    <!-- Jobs will be injected here -->
  </main>

  <footer class="footer">© 2025 Job Updates</footer>

  <script>
    async function loadJobs() {
      try {
        const res = await fetch('jobs.json');
        const jobs = await res.json();
        const container = document.getElementById('jobs-container');
        container.innerHTML = '';
        jobs.forEach(job => {
          const card = document.createElement('div');
          card.className = 'job-card';
          card.innerHTML = `
            <h2>${job.title}</h2>
            <p class="job-short">${job.short}</p>
            <a class="btn" href="${job.link}" target="_blank" rel="noopener">Read More</a>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('jobs-container').innerHTML = '<p style="color:red">Unable to load jobs.json. Make sure backend wrote jobs.json in the same folder.</p>';
      }
    }
    loadJobs();
  </script>
</body>
</html>
