<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Login</title>
  <script type="module">
    import firebaseConfig from './firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async function() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        alert('Logged in as ' + userCred.user.email + '. Now you can open admin panel.');
        window.location.href = 'admin.html';
      } catch (e) {
        alert('Login failed: ' + e.message);
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input id="email" placeholder="Email" value="kalluriashok2627@gmail.com" />
    <input id="password" type="password" placeholder="Password" value="AshokUma@1327" />
    <button onclick="login()">Login</button>
    <p>Use the admin credentials you set in Firebase Authentication.</p>
  </div>
</body>
</html>
